name: Network Analytics CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python src/data_generator.py
      - run: python src/database.py
      - run: python src/ml_model.py
      - run: flake8 src tests --count --select=E9,F63,F7,F82 --show-source
      - run: pytest -q
